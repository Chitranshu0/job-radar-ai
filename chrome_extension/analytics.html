<!DOCTYPE html>
<html>
<head>
    <title>Job Radar AI - Advanced Analytics</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        .header { margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .header h1 { margin: 0; color: #60a5fa; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
        
        .score-box { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .score-box .score { font-size: 54px; font-weight: bold; color: #10b981; text-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); margin-top: 10px;}
        
        canvas { max-width: 100%; }
        
        .pill { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 4px; }
        .pill.match { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .pill.miss { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .improvement-list { padding-left: 20px; }
        .improvement-list li { margin-bottom: 12px; color: #cbd5e1; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <span style="font-size: 32px;">📊</span>
            <h1>Advanced Candidate Analytics</h1>
        </div>
        
        <div class="grid-3">
            <div class="card score-box">
                <h3 style="margin: 0; color: #94a3b8;">Overall Match Fit</h3>
                <div class="score" id="overall-score">--</div>
            </div>
            
            <div class="card" style="grid-column: span 2;">
                <h3 style="margin-top: 0; color: #94a3b8;">AI Executive Summary</h3>
                <p id="summary-text" style="line-height: 1.6; color: #e2e8f0; font-size: 15px;">Loading analytics...</p>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="card">
                <h3 style="margin-top: 0; color: #94a3b8;">Category Breakdown</h3>
                <div style="height: 250px;"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="card">
                <h3 style="margin-top: 0; color: #94a3b8;">Score Distribution</h3>
                <div style="height: 250px;"><canvas id="distributionChart"></canvas></div>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="card">
                <h3 style="margin-top: 0; color: #34d399;">Matched Skills (Transformer Verified)</h3>
                <div id="matched-skills"></div>
            </div>
            <div class="card">
                <h3 style="margin-top: 0; color: #f87171;">Missing / Gap Skills</h3>
                <div id="missing-skills"></div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-top: 0; color: #fbbf24;">Recommended Improvement Actions</h3>
            <ul class="improvement-list" id="improvement-actions">
            </ul>
        </div>
        
    </div>
    
    <script src="chart.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
