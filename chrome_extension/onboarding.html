<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Radar AI Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
        }

        body { 
            font-family: 'Outfit', system-ui, sans-serif; 
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary); 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .container { 
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 48px; 
            border-radius: 20px; 
            width: 100%;
            max-width: 480px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 { 
            color: var(--text-primary); 
            margin: 0; 
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-icon {
            width: 28px;
            height: 28px;
            color: var(--accent-primary);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-top: 0;
            margin-bottom: 32px;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .step { margin-bottom: 24px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500; 
            color: var(--text-primary);
            font-size: 14px;
        }
        
        input[type="file"], input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid var(--card-border); 
            color: var(--text-primary); 
            border-radius: 10px; 
            margin-bottom: 4px;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 12px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        input[type="text"]:focus, input[type="password"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        
        button { 
            background: var(--accent-primary); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px;
            width: 100%; 
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px var(--accent-glow);
            font-family: inherit;
        }
        
        button:hover { 
            background: #2563eb; 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        button:active {
            transform: translateY(1px);
        }
        
        .success { 
            color: var(--success); 
            display: none; 
            margin-top: 20px; 
            text-align: center; 
            font-weight: 500; 
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: fadeIn 0.3s ease-out;
        }

        .helper-text {
            color: var(--text-secondary);
            display: block;
            margin-top: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="header-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <h1>Job Radar AI Setup</h1>
        </div>
        <p class="subtitle">Let's get your profile ready so we can automatically analyze jobs for you.</p>
        
        <div class="step">
            <label>1. Upload your Resume (PDF)</label>
            <input type="file" id="resumeFile" accept="application/pdf">
        </div>
        
        <div class="step">
            <label>2. Upload Cover Letter (Optional, PDF)</label>
            <input type="file" id="coverLetterFile" accept="application/pdf">
        </div>

        <div class="step">
            <label>3. Enter Groq API Key</label>
            <input type="password" id="apiKey" placeholder="gsk_...">
            <span class="helper-text">Used to power the AI matching locally.</span>
        </div>

        <button id="saveBtn">Save & Initialize</button>
        <div id="status" class="success">Setup complete! You can close this tab.</div>
    </div>
    <script src="onboarding.js"></script>
</body>
</html>
