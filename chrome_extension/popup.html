<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 320px; 
      padding: 15px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    button { 
      padding: 10px 15px; 
      background-color: #2563eb; 
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 6px; 
      width: 100%;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover { 
      background-color: #c5d5ff; 
    }
    #result { 
      margin-top: 15px; 
      font-size: 13px; 
      color: #444;
      padding: 10px;
      background-color: white;
      border-radius: 4px;
      border: 1px solid #ddd;
      min-height: 40px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Job Radar AI</h3>
  <button id="analyzeBtn">Analyze Page</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
