<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 320px; 
      padding: 20px; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #111827;
      color: #f3f4f6;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
    }
    p {
        font-size: 13px;
        color: #9ca3af;
        text-align: center;
        margin-bottom: 20px;
    }
    button { 
      padding: 12px 15px; 
      background: linear-gradient(135deg, #2563eb, #4f46e5); 
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 8px; 
      width: 100%;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    button:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    #result { 
      margin-top: 15px; 
      font-size: 13px; 
      color: #60a5fa;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h3><span style="font-size: 22px;">✨</span> Job Radar AI</h3>
  <p>Manually analyze this page for a Job Description and show the AI match dashboard.</p>
  <button id="analyzeBtn">Analyze Page</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
